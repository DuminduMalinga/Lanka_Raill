name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same Flutter version the app is developed and tested with.
  FLUTTER_VERSION: "3.50.0"

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Generated localisation files are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/core/l10n/gen

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show runner size
        run: |
          nproc
          free -m

      # android/gradle.properties asks Gradle for an 8 GB heap, which suits a
      # developer PC but not a 7 GB runner (the build thrashed and hit the time
      # limit). This user-level file overrides it for CI only.
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          org.gradle.workers.max=2
          PROPS

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install packages
        run: flutter pub get

      # Builds with R8 shrinking and Dart obfuscation, the way releases are
      # built, so problems that only appear in release builds (such as a
      # missing permission or a stripped class) are caught here. One phone
      # architecture is enough for that check. There is no android/key.properties
      # in CI, so it is signed with the debug key and cannot be published.
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
